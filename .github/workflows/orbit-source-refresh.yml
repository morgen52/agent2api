name: ORBIT public research radar refresh
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/orbit-source-refresh.yml"
permissions:
  contents: write
concurrency:
  group: orbit-public-research-radar
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbit-preview-2026-11
          persist-credentials: true
      - name: Test source parser (offline)
        run: cd orbit-preview && python3 -m unittest -v test_refresh_sources.py
      - name: Fetch public arXiv metadata
        run: python3 orbit-preview/refresh_sources.py
      - name: Publish only public metadata if changed
        run: |
          if ! git diff --quiet -- orbit-preview/research.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add orbit-preview/research.json
            git commit -m "ORBIT: refresh public arXiv metadata radar"
            git push origin HEAD:orbit-preview-2026-11
          else
            echo "No source changes; no commit needed."
          fi
