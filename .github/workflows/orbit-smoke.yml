name: ORBIT public endpoint smoke test
on:
  push:
    branches: [orbit-preview-2026-11]
    paths:
      - "orbit-preview/index.html"
      - "orbit-preview/research.json"
      - "orbit-preview/check_live.py"
      - "orbit-preview/browser_smoke.py"
      - ".github/workflows/orbit-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orbit-public-endpoint
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Test exact-deploy verifier against stale HTML (offline)
        run: cd orbit-preview && python3 -m unittest -v test_check_live.py
      - name: Verify live HTTP content
        run: python3 orbit-preview/check_live.py
      - name: Install browser test dependencies
        run: |
          python3 -m pip install --user playwright==1.56.0
          python3 -m playwright install chromium
      - name: Verify mobile UI and live public research feed
        run: python3 orbit-preview/browser_smoke.py
