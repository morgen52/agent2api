x;align-items:center;gap:6px;border:1px solid #4a5e55;padding:5px 9px;border-radius:999px}.dotwarn{background:var(--orange);box-shadow:none}.context{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-top:10px}.context span{font-size:20px}.context p{margin:0;color:var(--muted);font-size:12px}.context b{display:block;font-size:13px}.muted{color:var(--muted)}.prompt{white-space:pre-wrap;word-break:break-word;font-size:12px;max-height:270px;overflow:auto;background:#091d20;border:1px solid var(--line);border-radius:12px;padding:15px}.notice{background:#47332355;border:1px solid #8b694755;border-radius:13px;padding:11px 13px;color:#f5d7b9;font-size:12px}.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#d5fae8;color:#173b31;padding:11px 18px;border-radius:40px;font-size:13px;box-shadow:0 15px 40px #0008;z-index:999;max-width:90vw;text-align:center}.graphsvg{width:100%;display:block;height:auto}.statnote{display:flex;align-items:center;gap:9px;margin:12px 0;color:var(--muted);font-size:12px}.statnote em{color:var(--green);font-style:normal}.nudge{color:var(--green);font-size:13px}.qmark{font-size:12px;color:var(--orange)}

const GOALS=[

const CARDS=[
{id:'c1',category:'行为内化',time:'30秒',title:'为什么换一句 System Prompt，能力就可能崩？',thesis:'行为可能学会了，但触发行为的上下文条件没有泛化。',labels:['输入条件','行为分布','泛化'],type:'split',draw:{left:['训练时','特定身份提示','高概率行为 B'],right:['评估时','身份提示改变','B 概率可能下降']},detail:'示意：SFT 可能同时拟合“在什么条件下启动某种行为”与“该行为怎样执行”。这不能证明特定 Token 一定是根因；需要控制其他变量的对照实验。',quiz:'只替换模型身份提示，行为明显改变，最直接说明什么？',opts:['条件分布存在敏感性','模型完全忘记了技能'],correct:0,explain:'首先只能推断输入条件敏感，不能直接证明内部技能消失。',source:'基于此前的研究讨论；机制是假设，非已证实结论'},
{id:'c2',category:'后训练',time:'35秒',title:'OPD 比行为克隆多学到了什么？',thesis:'不是只模仿选中的 Token，还可以学习 Teacher 的相对概率偏好。',labels:['Hard Label','Soft Distribution'],type:'compare',draw:{left:['BC / 硬标签','A ✓','B / C 未直接区分'],right:['分布蒸馏','A 70%','B 25% · C 5%']},detail:'普通监督行为克隆以示范 Token 的负对数似然为目标。分布式蒸馏使用 Teacher 在上下文中的 Token 分布；具体 OPD 实现的 KL 方向、采样来源和覆盖 Token 需单独确定。',quiz:'为什么软分布可能包含更多教学信息？',opts:['保留替代 Token 的相对偏好','保证 Student 一定比 Teacher 强'],correct:0,explain:'软分布保存相对偏好，不保证 Student 必然超越 Teacher。',source:'知识示例：标准交叉熵 / 分布蒸馏原理'},
{id:'c3',category:'Agent Harness',time:'40秒',title:'Multi-Harness RL 真正难的是哪一层？',thesis:'不是把工具名统一，而是把执行、状态与奖励语义统一。',labels:['接口','状态','奖励'],type:'layers',draw:{left:['不同 Harness','CC · Codex · CUA','统一适配层'],right:['统一 Trajectory','Action / Observation','Reward / Replay']},detail:'如果不同 Harness 的观测、状态恢复、终止条件不同，只统一 JSON 字段不足以保证训练语义一致。最小实验应固定任务和模型，验证同轨迹能否回放和计算可比奖励。',quiz:'两个 Harness 输出了同样的 JSON，是不是就能保证奖励可比？',opts:['不能，还要对齐执行语义','可以，字段一致就够了'],correct:0,explain:'字段一致≠语义一致，尤其是副作用、终止条件与环境恢复。',source:'跨 Harness 适配机制示例'},
{id:'c4',category:'Meta Thinking',time:'35秒',title:'一阶 Thinking 和二阶 Thinking 差在哪？',thesis:'一阶解决眼前任务；二阶更新以后解决类似问题的策略。',labels:['Task State','Meta State'],type:'loop',draw:{left:['本轮任务','观察 → 行动','获得结果'],right:['跨任务策略','归纳经验','影响下次行动']},detail:'二阶机制不只是“思考更长”，而是产生能改变未来策略的更新，并在新任务上验证收益。难点是把策略更新与任务执行收益做因果区分。',quiz:'什么更能证明二阶 Thinking？',opts:['换任务后仍改善策略','单次 CoT 变长'],correct:0,explain:'跨任务可迁移的策略改进，比单次推理长度更有说服力。',source:'二阶策略学习机制示例'},
{id:'c5',category:'Personal Agent',time:'30秒',title:'Personal Agent 不等于 Task Agent 加记忆',thesis:'区别在于长期目标能否持续影响“下一件该做什么”。',labels:['Goal Graph','Initiative','Human Gain'],type:'flow',draw:{left:['任务 Agent','指令 → 执行','完成 → 停止'],right:['个人 Agent','目标 → 发现','执行 → 复盘 → 继续']},detail:'长期记忆只是信息存储；真正的控制层还要决定机会优先级、干预时机、执行范围，并对长期收益与注意力成本负责。',quiz:'哪项能力最能区分个人 Agent？',opts:['主动选择值得做的事','记住用户名字'],correct:0,explain:'记忆是基础，但主动决策与长期收益才是架构差异。',source:'本产品的研究假设（尚未通过真实用户实验验证）'},
{id:'c6',category:'人类收益',time:'30秒',title:'为什么“AI 完成 20 个任务”可能不是成功？',thesis:'没有减少你的管理负担，也没有改善学习或长期成果。',labels:['管理成本','知识迁移','目标进展'],type:'triad',draw:{left:['Task Metrics','完成数量','正确率'],right:['Human Gain','省管理 · 真学会','可验证里程碑']},detail:'要拆开测量：人工管理/审查分钟、延迟知识迁移测验、外部可验证里程碑。单纯阅读次数或 AI 生成内容量不代表人的真实收益。',quiz:'哪项最能证明“学进去了”？',opts:['一周后能解决新题','今天刷了 30 张卡'],correct:0,explain:'迁移能力是更强证据，阅读数量只是活动记录。',source:'本产品评估框架；验收实验尚未开展'},
{id:'c7',category:'Agent Runtime',time:'45秒',title:'浏览器里多 Session Serving 比单次推理难在哪？',thesis:'不仅分配算力，还要跨生命周期管理每个 Session 的可用状态。',labels:['WebGPU','KV Cache','Lifecycle'],type:'layers',draw:{left:['前台 Session','渲染 / 高优先级','GPU KV'],right:['后台 Session','冻结 / 恢复','CPU · Storage']},detail:'WebGPU 缺少传统服务器调度器拥有的强抢占接口，前台 GUI 与推理共享 GPU。跨 session 的 KV residency 与页面生命周期会互相影响。',quiz:'只优化单次生成延迟，为什么不够？',opts:['忽略并发与状态恢复','无法优化矩阵乘法'],correct:0,explain:'多 session 的关键是共享资源与跨请求状态，而非只优化单次调用。',source:'多会话浏览器推理机制的示例'}
];

if(c.type==='triad'){svg+=pill(24,25,260,63,t.left[0]);svg+=pill(316,25,260,63,t.right[0],'#1b4c3a','#72c6a1');svg+=pill(24,113,260,55,t.left[1]);svg+=pill(316,113,260,55,t.right[1],'#1b4c3a','#72c6a1',15);svg+=pill(24,192,260,55,t.left[2]);svg+=pill(316,192,260,55,t.right[2],'#1b4c3a','#72c6a1');svg+='<path d="M294 150 L307 150" stroke="#a6efd0" stroke-width="2" marker-end="url(#arr)"/>'}
else if(c.type==='loop'){svg+=pill(28,21,252,62,t.left[0]);svg+=pill(320,21,252,62,t.right[0],'#1b4c3a','#72c6a1');svg+=pill(28,110,252,60,t.left[1]);svg+=pill(320,110,252,60,t.right[1],'#1b4c3a','#72c6a1');svg+=pill(28,204,252,60,t.left[2]);svg+=pill(320,204,252,60,t.right[2],'#1b4c3a','#72c6a1');svg+='<path d="M154 85 V106 M446 85 V106 M154 172 V200 M446 172 V200 M320 234 H288 M447 265 C560 298 600 10 475 19" fill="none" stroke="#84d7b5" stroke-width="2.3" marker-end="url(#arr)"/>'}
else{svg+=pill(22,24,262,62,t.left[0]);svg+=pill(316,24,262,62,t.right[0],'#174c38','#75caa2');svg+=pill(22,110,262,63,t.left[1]);svg+=pill(316,110,262,63,t.right[1],'#174c38','#75caa2',16);svg+=pill(22,200,262,63,t.left[2]);svg+=pill(316,200,262,63,t.right[2],'#174c38','#75caa2',15);svg+='<g stroke="#89e4bd" stroke-width="2" fill="none" marker-end="url(#arr)"><path d="M152 87 V105 M447 87 V105 M152 176 V195 M447 176 V195"/></g>'}
return svg+'</svg>'}
function nav(){document.getElementById('sidenav').innerHTML=NAV.map(([k,i,t])=>`<button data-page="${k}" class="${state.view===k?'active':''}"><span class="ico">${i}</span>${t}</button>`).join('');document.getElementById('bottom').innerHTML=NAV.map(([k,i,t])=>`<button data-page="${k}" class="${state.view===k?'active':''}"><span class="ico">${i}</span>${t}</button>`).join('')}
function header(title,lead){return `<div class="topline"><span><span class="dot"></span>Personal Agent · 本地原型</span><span class="smalltag">V0.1 · Preview</span></div><h1 class="sectiontitle">${title}</h1><p class="lead">${lead}</p>`}
function feed(){let c=CARDS[state.idx%CARDS.length];markViewed(c.id);let expanded=state.expanded.includes(c.id);let answered=state.answers[c.id];return header('只管学，别管调度。','一个机制，一张图。每张卡片约 30 秒。')+`<section class="hero"><div class="ring"></div><div class="eyebrow">TODAY'S MODE</div><h2>好奇 → 理解 → 应用</h2><p>后台负责组织工作；你只负责把新知识带走。</p><div class="pills"><span class="pill">视觉优先</span><span class="pill">少阅读</span><span class="pill">可追溯</span></div></section><div class="strip"><strong>为你选出的知识</strong><small>${state.idx%CARDS.length+1} / ${CARDS.length} · ${state.completed.length} 张已掌握</small></div><article class="paper"><div class="meta"><span class="badge">${escapeHtml(c.category)}</span><span>◷ ${c.time}</span></div><h3>${escapeHtml(c.title)}</h3><p class="thesis">${escapeHtml(c.thesis)}</p>${graphic(c)}<div class="pills">${c.labels.map(s=>`<span class="pill">${escapeHtml(s)}</span>`).join('')}</div><div class="actions"><button class="btn" data-action="master" data-id="${c.id}">${state.completed.includes(c.id)?'✓ 已掌握':'✓ 看懂了'}</button><button class="btn alt" data-action="detail" data-id="${c.id}">${expanded?'收起机制':'再解释一下'}</button><button class="btn ghost" data-action="next">下一张 →</button><button class="btn ghost" data-action="speak">♫ 听讲</button></div>${expanded?`<div class="detail"><strong>为什么？</strong><br>${escapeHtml(c.detail)}<p class="micro">出处/证据类型：${escapeHtml(c.source)}</p></div>`:''}<div class="quiz"><p class="qtitle">◉ 10 秒自测 · ${escapeHtml(c.quiz)}</p><div class="choices">${c.opts.map((x,i)=>`<button class="choice ${answered!==undefined?(i===c.correct?'right':(i===answered&&i!==c.correct?'wrong':'')):''}" data-action="answer" data-id="${c.id}" data-n="${i}">${i===0?'A':'B'} · ${escapeHtml(x)}</button>`).join('')}</div>${answered!==undefined?`<div class="feedback">${answered===c.correct?'✓ 理解正确':'↺ 值得再看一下'} · ${escapeHtml(c.explain)}</div>`:''}</div></article><p class="footnote">卡片内容来自已有讨论与基础技术原理；研究假设已标记。答题与掌握状态保存在本机，尚无跨设备同步或实时 AI 生成。</p>`}
function opportunities(){return header('下一件事，我来找。','根据长期目标生成的初始建议；并非实时监控或自动执行。')+`<div class="notice">✦ 此版本会帮你组织机会与生成可执行任务包。真正的后台搜索、委派执行还需接入模型与授权工具。</div><div class="strip"><strong>优先机会</strong><small>${OPS.length-state.dismissed.length} 个待评估</small></div>`+OPS.filter(o=>!state.dismissed.includes(o.id)).map((o,i)=>`<article class="paper"><div class="rowcard"><span class="symbol">${o.icon}</span><div><h3>${escapeHtml(o.title)}</h3><p>${escapeHtml(o.gain)}</p><div class="score">${i===0?'优先推荐':'候选机会'} · ${escapeHtml(GOALS.find(g=>g.id===o.for).name)}</div><div class="micro">边界：${escapeHtml(o.risk)}</div></div></div><div class="opfoot"><button class="btn" data-action="task" data-id="${o.id}">查看执行任务包 ↗</button><button class="btn alt" data-action="queue" data-id="${o.id}">${state.saved.includes(o.id)?'✓ 已加入计划':'加入计划'}</button><button class="btn ghost" data-action="dismiss" data-id="${o.id}">跳过</button></div></article>`).join('')+(state.dismissed.length===OPS.length?'<div class="empty">今天没有待评估的机会。你可以去刷图卡。</div>':'')+`<div id="taskbox"></div>`}
function goals(){return header('所有任务都有来处。','Goal Graph：记录长期目标，而不只是任务列表。')+`<div class="paper"><svg class="graphsvg" viewBox="0 0 560 270" role="img" aria-label="长期目标图"><g fill="none" stroke="#5c927b" stroke-width="2"><path d="M280 64 L94 137 M280 64 L280 137 M280 64 L466 137"/></g><rect x="172" y="16" rx="19" width="216" height="51" fill="#245642" stroke="#6ad0a1"/><text x="280" y="47" fill="#e0ffec" text-anchor="middle" font-size="17">长期人类收益</text>${[['算法内化',15],['Harness',200],['持续学习',387]].map(([s,x])=>`<rect x="${x}" y="140" rx="15" width="158" height="65" fill="#153532" stroke="#4a8e78"/><text x="${x+79}" y="178" fill="#e5f7ef" font-size="16" text-anchor="middle">${s}</text>`).join('')}<text x="280" y="247" fill="#94aba9" font-size="12" text-anchor="middle">工作 / 研究 / 学习共享一个长期 Goal Graph</text></svg></div>`+GOALS.map(g=>`<article class="paper goal"><div class="rowcard"><span class="symbol">${g.icon}</span><div><h3>${escapeHtml(g.name)}</h3><p>${escapeHtml(g.what)}</p><div class="score">${escapeHtml(g.status)}</div></div></div><div class="statnote"><span>关联图卡</span><em>${g.links.length} 张</em><span>· 可验证里程碑</span><span class="qmark">尚未接入</span></div></article>`).join('')+`<p class="footnote">这些目标是根据此前讨论做的初始归纳，不代表用户已确认全部目标及优先级；不包含私人账号、地址或敏感凭据。</p>`}
function gains(){let tests=Object.keys(state.answers).length,correct=Object.entries(state.answers).filter(([k,v])=>CARDS.find(c=>c.id===k)?.correct===v).length;return header('只统计真实发生的收益。','不虚构“省了多少分钟”或者“增长了多少知识”。')+`<div class="split"><div class="tile"><div class="label">已完成图卡</div><div class="num">${state.completed.length}</div><div class="micro">由你的操作记录</div></div><div class="tile"><div class="label">自测正确率</div><div class="num">${tests?Math.round(100*correct/tests)+'%':'—'}</div><div class="micro">${tests} 次独立卡片作答</div></div><div class="tile"><div class="label">管理时间净节省</div><div class="num">${state.baselineMinutes!==''&&state.reviewMinutes!==''?(Number(state.baselineMinutes)-Number(state.reviewMinutes))+'m':'待测'}</div><div class="micro">需要同类任务基线</div></div><div class="tile"><div class="label">7 天知识迁移</div><div class="num">待测</div><div class="micro">不能由今天看懂推算</div></div></div><div class="strip"><strong>记录真实成本</strong><small>可选 · 仅本机</small></div><div class="paper"><div class="micro" style="margin:0 0 9px">同类任务：过去人工管理分钟数</div><input class="field" id="baseline" inputmode="numeric" type="number" min="0" placeholder="例如 45" value="${escapeHtml(state.baselineMinutes)}"/><div class="micro" style="margin:12px 0 9px">本次使用后人工管理分钟数</div><input class="field" id="review" inputmode="numeric" type="number" min="0" placeholder="例如 20" value="${escapeHtml(state.reviewMinutes)}"/><div class="actions"><button class="btn" data-action="save-metrics">记录本次观察</button></div><p class="footnote">此差值仅是自报观察，不构成因果结论。严谨评估需同类任务对照。</p></div><div class="strip"><strong>控制数据</strong><small>没有远程服务器</small></div><div class="paper"><p class="muted" style="font-size:13px;margin-top:0">可导出学习记录，或者导入之前导出的 JSON。刷新网页后同一浏览器保留数据。</p><div class="actions"><button class="btn alt" data-action="export">导出我的记录 ↓</button><button class="btn alt" data-action="import">导入 JSON ↑</button><button class="btn ghost" data-action="reset">清空本机记录</button></div><input id="file" type="file" accept="application/json,.json" hidden/><p class="footnote">原型不向服务器上传数据；清除浏览器站点数据会同时清除本地进度。建议定期导出备份。</p></div>`}
function render(){nav();let html=state.view==='feed'?feed():state.view==='opportunities'?opportunities():state.view==='goals'?goals():gains();document.getElementById('main').innerHTML=html;window.scrollTo({top:0,behavior:'instant'})}
function showTask(id){const o=OPS.find(x=>x.id===id);if(!o)return;const txt=`你是我的 Personal Agent，请直接推进这个目标：\n\n${o.task}\n\n工作协议：主动找原始材料和现有实现；独立验证；减少向我索取中间判断；交付可运行成果、证据、反例和三张极简机制图。涉及外部发布、账户变更或不可逆操作必须先取得授权。`;
let target=document.getElementById('taskbox');target.innerHTML=`<div class="paper" style="border-color:#5e9c7e"><h3 style="font-size:17px">${escapeHtml(o.title)} · 执行包</h3><div class="prompt">${escapeHtml(txt)}</div><div class="actions"><button class="btn" data-action="copy" data-id="${id}">复制任务指令</button><button class="btn alt" data-action="close-task">收起</button></div><p class="footnote">这只是可复制的任务包，尚未自动派发给后台模型或 Coding Agent。</p></div>`;target.scrollIntoView({behavior:'smooth',block:'nearest'});window.lastTask=txt;}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('已复制，去 ChatGPT / Coding Agent 执行')}catch(e){let ta=document.createElement('textarea');ta.value=t;document.body.append(ta);ta.select();try{document.execCommand('copy');toast('已复制')}catch(e){toast('请手动复制任务包')}ta.remove()}}
document.addEventListener('click',e=>{let pg=e.target.closest('[data-page]');if(pg){set({view:pg.dataset.page});return}let el=e.target.closest('[data-action]');if(!el)return;let a=el.dataset.action,id=el.dataset.id;if(a==='next'){set({idx:(state.idx+1)%CARDS.length})}else if(a==='master'){if(!state.completed.includes(id)){state.completed.push(id);event('master',id);save()}render();toast('已记录为“自评掌握”')}else if(a==='detail'){state.expanded=state.expanded.includes(id)?state.expanded.filter(x=>x!==id):[...state.expanded,id];set({expanded:state.expanded});}else if(a==='answer'){if(state.answers[id]===undefined){state.answers[id]=Number(el.dataset.n);event('quiz',id);save();render()}}else if(a==='speak'){if(!('speechSynthesis'in window)){toast('当前浏览器不支持语音朗读');return}let c=CARDS[state.idx%CARDS.length];speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(`${c.title}。${c.thesis}。${c.detail}`);u.lang='zh-CN';u.rate=1.06;speechSynthesis.speak(u);toast('正在朗读图卡')}else if(a==='task'){showTask(id)}else if(a==='queue'){if(!state.saved.includes(id)){state.saved.push(id);event('saved',id);save()}render();toast('已加入本机计划')}else if(a==='dismiss'){state.dismissed.push(id);event('dismissed',id);set({dismissed:state.dismissed})}else if(a==='copy'){copy(window.lastTask||OPS.find(o=>o.id===id)?.task||'')}else if(a==='close-task'){document.getElementById('taskbox').innerHTML=''}else if(a==='save-metrics'){let a=document.getElementById('baseline').value,b=document.getElementById('review').value;if((a!==''&&Number(a)<0)||(b!==''&&Number(b)<0))return toast('请输入不小于 0 的分钟数');set({baselineMinutes:a,reviewMinutes:b});event('metric','self-report');toast('已存储本机观察')}else if(a==='export'){let obj={version:1,exportedAt:new Date().toISOString(),state};let blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='orbit-learning-state.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}else if(a==='import'){document.getElementById('file').click()}else if(a==='reset'){if(confirm('确定清空当前浏览器里所有学习进度？此操作不能撤销。')){localStorage.removeItem(SKEY);state={...BASE};render()}}});
document.addEventListener('change',async e=>{if(e.target.id!=='file')return;const file=e.target.files?.[0];if(!file)return;try{let txt=await file.text();if(txt.length>2000000)throw Error('too large');let data=JSON.parse(txt);if(data.version!==1||!data.state||!Array.isArray(data.state.completed))throw Error('format');let allowed=['view','idx','expanded','answers','completed','viewed','saved','dismissed','created','goals','events','baselineMinutes','reviewMinutes','workMilestones','importText'];let next={...BASE};for(let k of allowed)if(Object.prototype.hasOwnProperty.call(data.state,k))next[k]=data.state[k];state=next;save();render();toast('已导入本机学习状态')}catch(err){toast('JSON 格式不正确，未修改数据')}});
render();
</script></body></html>
