{id:'g3',icon:'🧠',name:'高密度学习与个人 AI',what:'把每次 AI 工作变成可吸收的图解和可靠知识。',status:'产品示例目标',links:['c5','c6'],stage:0}];
const CARDS=[
{id:'c8',category:'真实论文 · Harness RL',time:'45秒',title:'Harness Scaling：只训练 18 种配置，为什么能覆盖 243 种组合？',thesis:'把 Harness 拆成 5 个可控因素，用正交设计覆盖两两组合，再让同一任务经历相近配置。',labels:['5×3=243','正交设计18','跨Harness迁移'],type:'layers',draw:{left:['完整配置空间','5 因素 × 3 变体','243 种组合'],right:['结构化训练','18 种正交配置','同题相邻 Harness']},detail:'论文将 System Prompt、Tool、Observation、Context、Workflow 各设 3 个变体，组合空间为 243；采用 strength-2 正交设计选出 18 种训练配置，并给每个任务分配 K=2 个相近配置。报告对未见白盒组合及外部黑盒 Harness 的泛化提升。注意：不是证明任何 18 个随机配置都有效，也不等于无需适配即可接入所有 Harness。',quiz:'预算只能覆盖少量 Harness 时，论文优先保留哪种结构？',opts:['各因素及两两组合的平衡覆盖','只选择最强的一个复杂 Harness'],correct:0,explain:'正交设计保留一阶/两两组合覆盖，避免训练只见到偏置配置。',source:'原始论文：Harness Scaling，arXiv:2610.29458（2026-10-21），§3–4，18/243 来自实验设置。',sourceUrl:'https://arxiv.org/abs/2610.29458',published:'2026-10-21',evidence:'论文方法与实验'},
{id:'c9',category:'真实论文 · 行为内化',time:'40秒',title:'Harness-Zero：训练时借用强 Harness，部署时为什么能移除它？',thesis:'先把教师的建议改写成目标 Harness 可执行的动作，再用成功轨迹微调 Student。',labels:['动作空间对齐','Agent-as-Harness','蒸馏'],type:'flow',draw:{left:['训练阶段','强 Harness 给建议','代理修正目标动作'],right:['部署阶段','Student 已微调','只用固定目标 Harness']},detail:'论文的难点是教师 Harness 和目标 Harness 的动作/信息空间不同，不能直接复制教师轨迹。Harnessing agent 在目标 Harness 执行前修正学生动作，形成有效示范，再对学生微调。论文报告宏平均任务成功率从 23.3% 提升到 44.3%（实验范围内）；不能据此推断所有行为或所有模型都能迁移。',quiz:'为什么不能直接把强 Harness 的工具调用当 Student 标签？',opts:['因为工具动作与可见信息空间可能不同','因为所有 Harness 都有完全相同的动作空间'],correct:0,explain:'关键是目标动作空间对齐，先让示范在目标执行器中有效。',source:'原始论文：Harness-Zero，arXiv:2609.24974（2026-09-21），摘要与方法。',sourceUrl:'https://arxiv.org/abs/2609.24974',published:'2026-09-21',evidence:'论文摘要与实验'},
{id:'c1',category:'行为内化',time:'30秒',title:'为什么换一句 System Prompt，能力就可能崩？',thesis:'行为可能学会了，但触发行为的上下文条件没有泛化。',labels:['输入条件','行为分布','泛化'],type:'split',draw:{left:['训练时','特定身份提示','高概率行为 B'],right:['评估时','身份提示改变','B 概率可能下降']},detail:'示意：SFT 可能同时拟合“在什么条件下启动某种行为”与“该行为怎样执行”。这不能证明特定 Token 一定是根因；需要控制其他变量的对照实验。',quiz:'只替换模型身份提示，行为明显改变，最直接说明什么？',opts:['条件分布存在敏感性','模型完全忘记了技能'],correct:0,explain:'首先只能推断输入条件敏感，不能直接证明内部技能消失。',source:'基于技术机制的研究假设；机制是假设，非已证实结论'},
{id:'c2',category:'后训练',time:'35秒',title:'OPD 比行为克隆多学到了什么？',thesis:'不是只模仿选中的 Token，还可以学习 Teacher 的相对概率偏好。',labels:['Hard Label','Soft Distribution'],type:'compare',draw:{left:['BC / 硬标签','A ✓','B / C 未直接区分'],right:['分布蒸馏','A 70%','B 25% · C 5%']},detail:'普通监督行为克隆以示范 Token 的负对数似然为目标。分布式蒸馏使用 Teacher 在上下文中的 Token 分布；具体 OPD 实现的 KL 方向、采样来源和覆盖 Token 需单独确定。',quiz:'为什么软分布可能包含更多教学信息？',opts:['保留替代 Token 的相对偏好','保证 Student 一定比 Teacher 强'],correct:0,explain:'软分布保存相对偏好，不保证 Student 必然超越 Teacher。',source:'知识示例：标准交叉熵 / 分布蒸馏原理'},
{id:'c3',category:'Agent Harness',time:'40秒',title:'Multi-Harness RL 真正难的是哪一层？',thesis:'不是把工具名统一，而是把执行、状态与奖励语义统一。',labels:['接口','状态','奖励'],type:'layers',draw:{left:['不同 Harness','CLI · GUI · API','统一适配层'],right:['统一 Trajectory','Action / Observation','Reward / Replay']},detail:'如果不同 Harness 的观测、状态恢复、终止条件不同，只统一 JSON 字段不足以保证训练语义一致。最小实验应固定任务和模型，验证同轨迹能否回放和计算可比奖励。',quiz:'两个 Harness 输出了同样的 JSON，是不是就能保证奖励可比？',opts:['不能，还要对齐执行语义','可以，字段一致就够了'],correct:0,explain:'字段一致≠语义一致，尤其是副作用、终止条件与环境恢复。',source:'技术机制示例：跨 Harness 接入研究假设'},
{id:'c4',category:'Meta Thinking',time:'35秒',title:'一阶 Thinking 和二阶 Thinking 差在哪？',thesis:'一阶解决眼前任务；二阶更新以后解决类似问题的策略。',labels:['Task State','Meta State'],type:'loop',draw:{left:['本轮任务','观察 → 行动','获得结果'],right:['跨任务策略','归纳经验','影响下次行动']},detail:'二阶机制不只是“思考更长”，而是产生能改变未来策略的更新，并在新任务上验证收益。难点是把策略更新与任务执行收益做因果区分。',quiz:'什么更能证明二阶 Thinking？',opts:['换任务后仍改善策略','单次 CoT 变长'],correct:0,explain:'跨任务可迁移的策略改进，比单次推理长度更有说服力。',source:'技术机制示例：二阶策略学习假设'},
{id:'c5',category:'Personal Agent',time:'30秒',title:'Personal Agent 不等于 Task Agent 加记忆',thesis:'区别在于长期目标能否持续影响“下一件该做什么”。',labels:['Goal Graph','Initiative','Human Gain'],type:'flow',draw:{left:['任务 Agent','指令 → 执行','完成 → 停止'],right:['个人 Agent','目标 → 发现','执行 → 复盘 → 继续']},detail:'长期记忆只是信息存储；真正的控制层还要决定机会优先级、干预时机、执行范围，并对长期收益与注意力成本负责。',quiz:'哪项能力最能区分个人 Agent？',opts:['主动选择值得做的事','记住用户名字'],correct:0,explain:'记忆是基础，但主动决策与长期收益才是架构差异。',source:'本产品的研究假设（尚未通过真实用户实验验证）'},
{id:'c6',category:'人类收益',time:'30秒',title:'为什么“AI 完成 20 个任务”可能不是成功？',thesis:'没有减少你的管理负担，也没有改善学习或长期成果。',labels:['管理成本','知识迁移','目标进展'],type:'triad',draw:{left:['Task Metrics','完成数量','正确率'],right:['Human Gain','省管理 · 真学会','可验证里程碑']},detail:'要拆开测量：人工管理/审查分钟、延迟知识迁移测验、外部可验证里程碑。单纯阅读次数或 AI 生成内容量不代表人的真实收益。',quiz:'哪项最能证明“学进去了”？',opts:['一周后能解决新题','今天刷了 30 张卡'],correct:0,explain:'迁移能力是更强证据，阅读数量只是活动记录。',source:'本产品评估框架；验收实验尚未开展'},
{id:'c7',category:'Agent Runtime',time:'45秒',title:'浏览器里多 Session Serving 比单次推理难在哪？',thesis:'不仅分配算力，还要跨生命周期管理每个 Session 的可用状态。',labels:['WebGPU','KV Cache','Lifecycle'],type:'layers',draw:{left:['前台 Session','渲染 / 高优先级','GPU KV'],right:['后台 Session','冻结 / 恢复','CPU · Storage']},detail:'WebGPU 缺少传统服务器调度器拥有的强抢占接口，前台 GUI 与推理共享 GPU。跨 session 的 KV residency 与页面生命周期会互相影响。',quiz:'只优化单次生成延迟，为什么不够？',opts:['忽略并发与状态恢复','无法优化矩阵乘法'],correct:0,explain:'多 session 的关键是共享资源与跨请求状态，而非只优化单次调用。',source:'技术机制示例：浏览器多会话推理'}
];
const OPS=[
{id:'o1',icon:'🎯',title:'从 Prompt 触发依赖切入，定义可迁移能力的最小实验',for:'g1',gain:'可形成一套独立于单个 Harness 的控制变量实验',risk:'机制仍待验证',task:'设计一个最小 2×2 实验：Teacher 行为轨迹与 Student SFT 固定，系统性控制身份提示、角色模板与 Harness，验证 Prompt 条件敏感性。交付：机制假设、可执行基线、量化指标、反例及可复现脚本。不要只生成小实验清单；优先找已有数据和代码。'},

};
state.reviewDue = state.reviewDue && typeof state.reviewDue==='object' && !Array.isArray(state.reviewDue) ? state.reviewDue : {};
state.transferAnswers = state.transferAnswers && typeof state.transferAnswers==='object' && !Array.isArray(state.transferAnswers) ? state.transferAnswers : {};
// Migrate earlier local quiz answers using their original event timestamp.
for(const ev of state.events || []){
 if(ev && ev.kind==='quiz' && typeof ev.value==='string' && !state.reviewDue[ev.value]){
  const at=Date.parse(ev.at);
  if(Number.isFinite(at))state.reviewDue[ev.value]=new Date(at+ORBIT_WEEK_MS).toISOString();
 }
}
for(const id of Object.keys(state.answers||{})){
 if(!state.reviewDue[id])state.reviewDue[id]=new Date(Date.now()+ORBIT_WEEK_MS).toISOString();
}
save();
function orbitDue(){return CARDS.filter(c=>state.answers[c.id]!==undefined && state.reviewDue[c.id] && Date.parse(state.reviewDue[c.id])<=Date.now() && !state.transferAnswers[c.id] && ORBIT_TRANSFER[c.id]);}
function orbitPending(){return CARDS.filter(c=>state.answers[c.id]!==undefined && state.reviewDue[c.id] && !state.transferAnswers[c.id] && ORBIT_TRANSFER[c.id]);}
function orbitResults(){const a=Object.values(state.transferAnswers).filter(v=>v&&typeof v.correct==='boolean');return {n:a.length,passed:a.filter(v=>v.correct).length};}
function orbitReviewPage(){
 const due=orbitDue(),pending=orbitPending(),result=orbitResults();
 let html=header('七天后，换一道题。','不展示原卡片的结论。检验是否能把机制用到新情境，而非记住原题。');
 html+=`<div class="paper"><div class="meta"><span class="badge">延迟迁移 · 浏览器本地</span><span>${result.n} 次已完成</span></div><p class="thesis">首次自测后至少等待 7 天。这里的结果只是轻量迁移题表现，不等于真实工作能力或因果增益。</p></div>`;
 if(due.length){const c=due[0],t=ORBIT_TRANSFER[c.id];html+=`<article class="paper"><div class="meta"><span>${escapeHtml(c.category)}</span><span>第 1 / ${due.length} 道待测</span></div><h3 style="font-size:20px">${escapeHtml(t.q)}</h3><div class="choices">${t.opts.map((v,i)=>`<button class="choice" data-transfer-id="${c.id}" data-transfer-n="${i}">${String.fromCharCode(65+i)} · ${escapeHtml(v)}</button>`).join('')}</div><p class="footnote">只记录首次作答。答题前不会展示原卡结论。</p></article>`;}
 else if(pending.length){const next=pending.slice().sort((a,b)=>Date.parse(state.reviewDue[a.id])-Date.parse(state.reviewDue[b.id]))[0];html+=`<div class="paper"><h3>还没有到期的迁移题</h3><p class="muted">最近一次知识学习需要经过时间间隔才有意义。下一道预计 ${escapeHtml(new Date(state.reviewDue[next.id]).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'}))} 开放。</p></div>`;}
 else html+=`<div class="paper"><h3>先学一张，再回来</h3><p class="muted">完成一次图卡自测后，会自动安排 7 天后的不同情境题。再次打开本站时会显示到期复习；当前没有主动推送。</p></div>`;
 html+=`<div class="actions"><button class="btn alt" data-page="feed">← 返回学习流</button></div>`;
 return html;
}
const orbitOriginalRender=render;
render=function(){
 if(state.view==='review'){
  nav();document.getElementById('main').innerHTML=orbitReviewPage();window.scrollTo({top:0,behavior:'instant'});return;
 }
 orbitOriginalRender();
 if(state.view==='feed'){
  const due=orbitDue().length,pending=orbitPending().length;
  const banner=document.createElement('div');banner.className='paper';banner.style.cssText='margin-top:16px;padding:14px 17px;border-color:#3e695b';
  banner.innerHTML=`<div class="rowcard"><span class="symbol">↻</span><div style="flex:1"><h3 style="font-size:15px">${due?`${due} 道七天迁移题已到期`:'七天迁移复习'}</h3><p>${due?'不看原卡，先回答新情境问题。':pending?`${pending} 道题已排期，到期后开放。`:'首次自测后自动排期，避免把“今天看懂”当作学会。'}</p><div class="actions" style="margin-top:9px"><button class="btn alt" data-page="review">${due?'开始独立迁移测试':'查看复习计划'} →</button></div></div></div>`;
  document.querySelector('.hero')?.insertAdjacentElement('afterend',banner);
 }
 if(state.view==='gains'){
  const result=orbitResults();
  const score=document.getElementById('transfer-score');if(score)score.textContent=result.n?Math.round(result.passed*100/result.n)+'%':'待测';
  const sub=document.getElementById('transfer-sub');if(sub)sub.textContent=result.n?`${result.passed}/${result.n} 道延迟新情境题答对；非因果增益`:'7 天后独立新情境题；尚无结果';
  const paper=document.createElement('div');paper.className='paper';paper.innerHTML=`<div class="rowcard"><span class="symbol">↻</span><div><h3>七天迁移评测</h3><p>已到期 ${orbitDue().length} 道，等待到期 ${orbitPending().length-orbitDue().length} 道。首次答题后自动排期，不以刷卡数冒充学习效果。</p><div class="actions"><button class="btn" data-page="review">查看独立迁移题 →</button></div></div></div>`;
  document.querySelector('.split')?.insertAdjacentElement('afterend',paper);
 }
};
// Capture phase runs before original quiz click handler.
document.addEventListener('click',e=>{
 const btn=e.target.closest('[data-action="answer"]');if(!btn)return;
 const id=btn.dataset.id;
 if(id && state.answers[id]===undefined && !state.reviewDue[id]){
  state.reviewDue[id]=new Date(Date.now()+ORBIT_WEEK_MS).toISOString();save();
 }
},true);
document.addEventListener('click',e=>{
 const btn=e.target.closest('[data-transfer-id]');if(!btn)return;
 const id=btn.dataset.transferId,t=ORBIT_TRANSFER[id],n=Number(btn.dataset.transferN);
 if(!t || !Number.isInteger(n) || n<0 || n>=t.opts.length || !orbitDue().some(c=>c.id===id))return;
 state.transferAnswers[id]={chosen:n,correct:n===t.correct,at:new Date().toISOString()};
 event('delayed-transfer',id);save();
 render();toast(n===t.correct?'✓ 新情境题答对了':'已记录首次作答；这是需要复习的机制');
},true);
render();

</script>
<script>
'use strict';
// Public, metadata-only discovery; never label automatic abstracts as verified insights.
NAV.splice(1,0,['radar','⌁','研究雷达']);
const ORBIT_RADAR_URL='https://raw.githubusercontent.com/morgen52/agent2api/orbit-preview-2026-11/orbit-preview/research.json';
let radarData=null,radarLoading=false,radarError='';
try{const cached=JSON.parse(localStorage.getItem('orbit-public-radar-cache-v1')||'null');if(cached?.papers?.length)radarData=cached;}catch(e){}
async function loadRadar(force=false){
 if(radarLoading)return;
 radarLoading=true;radarError='';
 const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),12000);
 try{
  const resp=await fetch(ORBIT_RADAR_URL+'?hour='+Math.floor(Date.now()/3600000),{signal:ctrl.signal,cache:'no-store'});
  if(!resp.ok)throw new Error('HTTP '+resp.status);
  const obj=await resp.json();
  if(!Array.isArray(obj.papers)||obj.papers.length===0)throw new Error('无有效论文元数据');
  radarData={checked_at:obj.checked_at,papers:obj.papers.filter(x=>/^https:\/\/arxiv\.org\/abs\/\d{4}\.\d{4,5}$/.test(x.url)).slice(0,16)};
  if(!radarData.papers.length)throw new Error('来源链接校验失败');
  try{localStorage.setItem('orbit-public-radar-cache-v1',JSON.stringify(radarData));}catch(e){}
 }catch(e){radarError='本次联网更新失败，'+(radarData?'显示上次缓存。':'暂时无法获取论文雷达。');}
 finally{clearTimeout(timer);radarLoading=false;if(state.view==='radar')render();}
}
function radarPage(){
 const rows=radarData?.papers||[];
 const status=radarLoading?'正在检查 arXiv 公开来源…':radarError||'仅按标题与摘要筛选；尚未精读论文或核验实验。';
 const date=radarData?.checked_at?new Date(radarData.checked_at).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'}):'尚未更新';
 return header('最新研究线索，不冒充学会。','公开 arXiv 论文 → 关键词去重筛选 → 待核验候选。只有精读后才进入机制图卡。')
  +'<div class="paper" style="border-color:#48766a"><div class="micro">SOURCE RADAR · 公开元数据</div><p class="muted">'+escapeHtml(status)+'</p><div class="actions"><button class="btn alt" data-radar-refresh="1">检查更新 ↻</button><span class="micro">数据时间：'+escapeHtml(date)+'</span></div></div>'
  +(rows.length?rows.map((p,i)=>'<section class="paper" style="margin-top:13px"><div class="micro">线索 '+(i+1)+' / '+rows.length+' · 未精读 · arXiv:'+escapeHtml(p.id)+'</div><h3 style="margin:10px 0">'+escapeHtml(p.title)+'</h3><p class="muted">'+escapeHtml(p.abstract_excerpt||'暂无摘要片段')+'</p><p class="micro">相关词：'+escapeHtml((p.relevance_terms||[]).join(' · '))+'</p><div class="actions"><a class="btn alt" href="'+escapeHtml(p.url)+'" target="_blank" rel="noopener noreferrer">查看论文原文 ↗</a></div></section>').join(''):'<div class="paper"><p class="muted">尚无可展示的公开论文线索；已有的九张机制卡仍可离线阅读。</p></div>')
  +'<p class="footnote">来源为公开论文元数据；相关性分数不是质量评价，论文作者的主张不是独立复现结论。自动雷达不读取你的聊天、私有仓库或浏览器记录。</p>';
}
const renderBeforeRadar=render;
render=function(){
 if(state.view!=='radar'){renderBeforeRadar();return;}
 nav();document.getElementById('main').innerHTML=radarPage();
 window.scrollTo({top:0,behavior:'instant'});
 if(!radarData&&!radarLoading&&!radarError)loadRadar();
};
document.addEventListener('click',e=>{
 if(!e.target.closest('[data-radar-refresh]'))return;
 radarError='';loadRadar(true);render();
},true);
render();
</script>
